<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Dark circular background -->
  <circle cx="40" cy="40" r="39" fill="#1A1228"/>
  <!-- Outer ring -->
  <circle cx="40" cy="40" r="36" fill="none" stroke="#5B4B8A" stroke-width="1.5" opacity="0.8"/>
  <!-- Clock ticks at 12, 3, 6, 9 -->
  <line x1="40" y1="6" x2="40" y2="13" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="74" y1="40" x2="67" y2="40" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="74" x2="40" y2="67" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="6" y1="40" x2="13" y2="40" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minor ticks -->
  <line x1="59" y1="11.4" x2="56.5" y2="15.7" stroke="#5B4B8A" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="68.6" y1="21" x2="64.3" y2="23.5" stroke="#5B4B8A" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="68.6" y1="59" x2="64.3" y2="56.5" stroke="#5B4B8A" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="59" y1="68.6" x2="56.5" y2="64.3" stroke="#5B4B8A" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="21" y1="68.6" x2="23.5" y2="64.3" stroke="#5B4B8A" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="11.4" y1="59" x2="15.7" y2="56.5" stroke="#5B4B8A" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="11.4" y1="21" x2="15.7" y2="23.5" stroke="#5B4B8A" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="21" y1="11.4" x2="23.5" y2="15.7" stroke="#5B4B8A" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Three diamonds -->
  <polygon points="24,34 34,24 44,34 34,44" fill="#5B4B8A"/>
  <polygon points="36,34 46,24 56,34 46,44" fill="#7B6BA8"/>
  <polygon points="30,44 40,34 50,44 40,54" fill="#9B8FC8"/>
  <!-- Clock hand -->
  <line x1="40" y1="40" x2="53" y2="26" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <circle cx="40" cy="40" r="2.5" fill="#C9A84C"/>
</svg>
